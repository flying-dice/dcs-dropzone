appenders:
  console:
    type: stdout

  file:
    type: file
    filename: daemon.log
    maxLogSize: 50M

  errorFile:
    type: file
    filename: error.log

  onlyErrors:
    type: logLevelFilter
    appender: errorFile
    level: error

categories:
  default:
    appenders: [console, file, onlyErrors]
    level: debug
