services:
  app:
    build:
      context: ../..
      dockerfile: apps/webapp/Dockerfile
    environment:
      DropzoneWebapp_mongoUri: mongodb://mongodb:27017/dcs-dropzone
      DropzoneWebapp_authRedirectUrl: http://localhost:3000
      DropzoneWebapp_userCookieSecret: docker-compose-cookie-secret
      DropzoneWebapp_authServiceGh__clientId: Ov23li5IVDqsPjGrdLkN
      DropzoneWebapp_authServiceGh__clientSecret: 4e4ba8824ca0458c02e5fc7b0ebc6232e85b4022
      DropzoneWebapp_authServiceGh__redirectUrl: http://localhost:3000/auth/callback

    ports:
      - "3000:3000"

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
    mongo-data:
