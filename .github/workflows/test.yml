name: Tests
on: [push]

jobs:
  build:
    name: build-app
    runs-on: windows-latest
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}\.bun\install\cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.bun\install\cache
          key: ${{ runner.os }}-bun-install-cache-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-cache-

      - name: Install dependencies
        run: bun install

      - name: Add daemon bins to PATH
        run: echo "${{ github.workspace }}\apps\daemon\bin" >> $env:GITHUB_PATH

      - name: Run TypeScript Compiler
        run: bun run tsc

      - name: Build Webapp
        run: bun run webapp:build
        env:
          WEBAPP_URL: https://dcs-dropzone-container.flying-dice.workers.dev/

      - name: Build Daemon
        run: bun run daemon:build
        env:
          WEBAPP_URL: https://dcs-dropzone-container.flying-dice.workers.dev/

      - name: Build Launcher
        run: bun run launcher:build
        env:
          RELEASES_BASE_URL: https://github.com/flying-dice/dcs-dropzone/releases/latest/download/

      - name: Build Setup Installer
        run: iscc apps/launcher/installer.iss

      - name: Run tests
        run: bun --env-file=apps/daemon/.env.local --env-file=apps/launcher/.env.local --env-file=apps/webapp/.env.local test

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Logs
          path: logs/

      - name: Upload Daemon Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dcs-dropzone.tar
          path: 'apps/daemon/dist/dcs-dropzone.tar'

      - name: Upload Daemon Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dcs-dropzone.tar.manifest
          path: 'apps/daemon/dist/dcs-dropzone.tar.manifest'

      - name: Upload Launcher Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dropzone_Launcher.exe
          path: 'apps/launcher/dist/Dropzone_Launcher.exe'

      - name: Upload Setup Installer Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dropzone_Setup.exe
          path: 'apps/launcher/dist/Dropzone_Setup.exe'

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: 'unit.junit.xml'
