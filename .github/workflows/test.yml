name: Tests
on: [push]

jobs:
  build:
    name: build-app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium --with-deps

      - name: Add daemon bins to PATH
        run: echo "${{ github.workspace }}\apps\daemon\bin" >> $env:GITHUB_PATH

      - name: Build
        run: bun run build

      - name: Tests
        run: bun run tests

      - name: Playwright Tests
        run: bun run test:playwright

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Logs
          path: logs/

      - name: Upload JUnit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: |
            apps/**/unit.junit.xml
            packages/**/unit.junit.xml

      - name: Upload Daemon Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dcs-dropzone.tar
          path: 'apps/daemon/dist/dcs-dropzone.tar'

      - name: Upload Daemon Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dcs-dropzone.tar.manifest
          path: 'apps/daemon/dist/dcs-dropzone.tar.manifest'

      - name: Upload Launcher Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dropzone_Launcher.exe
          path: 'apps/launcher/dist/Dropzone_Launcher.exe'

      - name: Upload Setup Installer Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dropzone_Setup.exe
          path: 'apps/launcher/dist/Dropzone_Setup.exe'

      - name: Rename Playwright Report for upload
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .playwright-report) {
            Move-Item .playwright-report playwright-report
          }

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: 'apps/**/unit.junit.xml,packages/**/unit.junit.xml'
