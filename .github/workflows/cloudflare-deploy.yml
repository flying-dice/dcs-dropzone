name: Cloudflare Deploy

on:
  workflow_run:
    workflows: ["Semantic Release"]
    types: [completed]
    branches: [main]

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Sync secrets to Cloudflare
        run: |
          jq -n \
            --arg a "$DZ_WEBAPP_MONGO_URI" \
            --arg b "$DZ_WEBAPP_USER_COOKIE_SECRET" \
            --arg c "$DZ_WEBAPP_AUTH_REDIRECT_URL" \
            --arg d "$DZ_WEBAPP_URL" \
            --arg e "$DZ_WEBAPP_AUTH_SERVICE_GH" \
            '{
              DZ_WEBAPP_MONGO_URI: $a,
              DZ_WEBAPP_USER_COOKIE_SECRET: $b,
              DZ_WEBAPP_AUTH_REDIRECT_URL: $c,
              DZ_WEBAPP_URL: $d,
              DZ_WEBAPP_AUTH_SERVICE_GH: $e
            }' | bunx wrangler secret bulk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DZ_WEBAPP_MONGO_URI: ${{ secrets.DZ_WEBAPP_MONGO_URI }}
          DZ_WEBAPP_USER_COOKIE_SECRET: ${{ secrets.DZ_WEBAPP_USER_COOKIE_SECRET }}
          DZ_WEBAPP_AUTH_REDIRECT_URL: ${{ secrets.DZ_WEBAPP_AUTH_REDIRECT_URL }}
          DZ_WEBAPP_URL: ${{ secrets.DZ_WEBAPP_URL }}
          DZ_WEBAPP_AUTH_SERVICE_GH: ${{ secrets.DZ_WEBAPP_AUTH_SERVICE_GH }}

      - name: Deploy to Cloudflare
        run: bun run webapp:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
