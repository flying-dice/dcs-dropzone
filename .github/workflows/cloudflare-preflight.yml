name: Cloudflare Preflight

on:
  pull_request:
    branches: [main]

jobs:
  check-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Check Cloudflare secrets
        working-directory: packages/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          REQUIRED_SECRETS="DZ_WEBAPP_MONGO_URI DZ_WEBAPP_USER_COOKIE_SECRET DZ_WEBAPP_AUTH_REDIRECT_URL DZ_WEBAPP_URL DZ_WEBAPP_AUTH_SERVICE_GH"

          EXISTING=$(bunx wrangler secret list --format json | jq -r '.[].name')

          MISSING=""
          for secret in $REQUIRED_SECRETS; do
            if ! echo "$EXISTING" | grep -q "^${secret}$"; then
              MISSING="$MISSING $secret"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::Missing Cloudflare secrets:$MISSING"
            echo ""
            echo "Set them with:"
            for secret in $MISSING; do
              echo "  wrangler secret put $secret"
            done
            exit 1
          fi

          echo "All required Cloudflare secrets are configured."
